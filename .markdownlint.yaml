# markdownlint configuration (checked locally via `markdownlint-cli2` and in CI)
default: true

# prose lines are not wrapped at a fixed width
MD013: false

# fenced code blocks must declare a language
MD040: true

# the badges at the top of the README, which markdown has no way to
# give a height to
MD033:
  allowed_elements:
    - img

# tables use padded pipes: `| a | b |`
MD060:
  style: padded
