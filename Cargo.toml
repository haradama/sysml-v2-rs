[workspace]
# Resolver 3 picks dependency versions that the declared `rust-version`
# can build. No lockfile is checked in, so without it a fresh resolve
# takes the newest of everything and the minimum this workspace claims
# is whatever its dependencies happened to raise theirs to this week.
resolver = "3"
members = [
    "crates/sysml-corpus",
    "crates/sysml-stdlib",
    "crates/sysml-syntax",
    "crates/sysml-model",
    "crates/sysml-semantics",
    "crates/sysml-interchange",
    "crates/sysml-rust",
    "crates/sysml-diagram",
    "crates/sysml-lsp",
    "crates/sysml-wasm",
    "crates/sysml-cli",
]
# a development helper for looking at the generated diagrams: it pulls in a
# rasterizer the published crates must not depend on
exclude = [
    "tools/render",
    "crates/sysml-rust/tests/fixtures/inventory-store",
    "examples/arduino-uno",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
# The oldest toolchain a fresh resolve builds with; CI checks it, so the
# number is a promise. It moves when something in the tree raises its
# own, and that is not always something the tree declares: `yoke-derive`
# 0.8.3, published on 2026-09-15, carries no `rust-version` for the
# resolver to read and calls `str::from_utf8`, which is 1.87's. It
# arrives under `url`, which both `lsp-types` and `ureq` want.
rust-version = "1.87"
repository = "https://github.com/haradama/sysml-v2-rs"
readme = "README.md"
keywords = ["sysml", "kerml", "mbse", "modeling", "parser"]
categories = ["parser-implementations", "development-tools"]

[workspace.dependencies]
logos = "0.15"
rowan = "0.15"
clap = { version = "4", features = ["derive"] }

# rustc's own diagnostic renderer, taken out of it and published. What a
# finding looks like to a person -- the line quoted, the span underlined,
# what is known about it underneath -- is a solved problem, and solving
# it again badly is how a caret ends up half a line from what it means
# on any file with a wide character in it.
annotate-snippets = "0.12"

# These are `sysmlv2-*` on crates.io and `sysml-*` here: `sysml-model`
# and `sysml-cli` are somebody else's crates, published before this one
# existed, so the whole family took a name it could have all of rather
# than two of ten being odd. Each keeps its library name, so a `use
# sysml_model::…` reads the same either way.

# Test support, and the only workspace dependency with no version: a
# path dev-dependency without one is dropped from what `cargo publish`
# uploads, which is what keeps an unpublished crate out of a published
# one's manifest.
sysmlv2-corpus = { path = "crates/sysml-corpus" }

# The standard library, as text. Under EPL-2.0 rather than this
# workspace's MIT/Apache, which is the whole reason it is a crate of its
# own: whoever takes it on knows exactly what they are taking on.
sysmlv2-stdlib = { path = "crates/sysml-stdlib", version = "0.1.0" }

# The version here is the floor a published crate depends on, and it
# moves when what is above needs something the older one has not got:
# the tool and the server format to a width, which `sysmlv2-syntax`
# 0.1.1 cannot, and draw through a skin, which `sysmlv2-diagram` 0.1.0
# has not got, and read and write a document without building one, which
# `sysmlv2-interchange` 0.1.0 has no way to. That one's minor moves
# rather than its patch: `ImportError` gained a variant, and nothing
# stops a caller matching it exhaustively. A crate whose own source has
# not changed keeps
# `version.workspace = true` and the version it is published under,
# since a new number says it changed; a floor that nothing needs moved
# stays where it is, so that a dependent still builds against what it
# was tested with.
sysmlv2-syntax = { path = "crates/sysml-syntax", version = "0.1.2" }
sysmlv2-model = { path = "crates/sysml-model", version = "0.1.1" }
sysmlv2-semantics = { path = "crates/sysml-semantics", version = "0.1.0" }
sysmlv2-interchange = { path = "crates/sysml-interchange", version = "0.2.0" }
sysmlv2-rust = { path = "crates/sysml-rust", version = "0.1.0" }
sysmlv2-diagram = { path = "crates/sysml-diagram", version = "0.2.0" }

# What the WebAssembly module wraps. No version, like the corpus above:
# `sysmlv2-wasm` is not published, so a floor would be a promise to
# nobody.
sysmlv2-lsp = { path = "crates/sysml-lsp" }

# What every crate here is held to, said once.
#
# These were inner attributes at the top of each `lib.rs`, with the same
# paragraph of reasoning copied below them. Ten copies is nine chances to
# go stale, and they had: the paragraph named the two crates that did not
# turn `missing_docs` on and the reason each was exempt, and it went on
# saying it in eight files after both had turned it on. A rule that holds
# of the whole workspace belongs where the workspace is described.
#
# Each crate takes these with `[lints] workspace = true`; a lint one crate
# genuinely needs otherwise is taken there, on the item it is about, where
# a reader meets it with the code.
[workspace.lints.rust]
# Nothing here needs `unsafe`, and saying so is what keeps it that way.
# `forbid` rather than `deny` so that it cannot be turned off further in.
unsafe_code = "forbid"
# Every public item carries a line saying what it is for. The last two to
# turn this on were `sysml-model`, whose surface is generated and whose
# lines the generator writes -- the metamodel documents all 175
# metaclasses and every property, in the same comment a constraint's
# `says` comes from, and nothing had read it -- and `sysml-syntax`, which
# exempts the 279 syntax kinds, whose names are the documentation, and
# nothing else.
missing_docs = "warn"

# What the WebAssembly module is built with. Every byte of it is
# downloaded by whoever installs the VSCode extension and compiled again
# by their browser, so the longer build is worth it: 7.3 MiB to 6.3 MiB,
# and a minute rather than twenty seconds. A profile of its own so that
# building the CLI and running the tests stay as quick as they were.
[profile.wasm]
inherits = "release"
lto = true
codegen-units = 1
strip = true
panic = "abort"
