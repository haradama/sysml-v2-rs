[package]
name = "sysml-semantics"
description = "Name resolution and relationship reification for SysML v2 / KerML models"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
# its own, not the workspace one: `readme` inherited from
# `workspace.package` resolves against the workspace root, so every
# crate published carried the whole project's README
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
sysml-syntax.workspace = true
sysml-model.workspace = true

[dev-dependencies]
sysml-corpus.workspace = true
