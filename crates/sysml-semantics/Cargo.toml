[package]
name = "sysmlv2-semantics"
description = "Name resolution and relationship reification for SysML v2 / KerML models"
# its own: what a number moves for is a change in the crate it is on
version = "0.1.3"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
# its own, not the workspace one: `readme` inherited from
# `workspace.package` resolves against the workspace root, which would
# make every crate's README the whole project's
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lib]
name = "sysml_semantics"

[dependencies]
sysmlv2-syntax.workspace = true
sysmlv2-model.workspace = true

[dev-dependencies]
sysmlv2-corpus.workspace = true

[lints]
workspace = true
