[package]
name = "sysmlv2-cli"
description = "Command-line tools for SysML v2 models"
# its own, as the crates under it are: what a number moves for is a
# change in the crate it is on. 0.1.5 imports any language with `sysml
# import-code`, from a surface a tool for that language writes, and
# generates any with `sysml codegen`, through a generator that reads the
# plan.
version = "0.1.5"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
# its own, not the workspace one: `readme` inherited from
# `workspace.package` resolves against the workspace root, so every
# crate published carried the whole project's README
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lib]
name = "sysml_cli"
path = "src/lib.rs"

[[bin]]
name = "sysml"
path = "src/main.rs"

[dependencies]
clap.workspace = true
annotate-snippets.workspace = true
sysmlv2-syntax.workspace = true
sysmlv2-model.workspace = true
sysmlv2-semantics.workspace = true
# the standard library, so that `sysml check model/` resolves without
# being handed a path first
sysmlv2-stdlib.workspace = true
sysmlv2-interchange.workspace = true
# `schema` for `import-code --schema`, `plan --schema` and the MCP tool,
# which hand the author of an importer or a generator the shape of what
# they have to write or read
sysmlv2-rust = { workspace = true, features = ["schema"] }
sysmlv2-diagram.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
# a `Link` header is a URI reference, resolved against the page it came with
url = "2"
# `--via "python3 my tool.py"`: a command is split the way a shell splits
# one, so a path with a space in it can be quoted
shlex = "1"

[dev-dependencies]
sysmlv2-corpus.workspace = true

[lints]
workspace = true
