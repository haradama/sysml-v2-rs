[package]
name = "sysmlv2-interchange"
description = "Standard JSON interchange (SysML v2 API & Services serialization) for sysml-model"
# its own, now that it has one: the lints it declared are the
# workspace's
version = "0.1.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
# its own, not the workspace one: `readme` inherited from
# `workspace.package` resolves against the workspace root, so every
# crate published carried the whole project's README
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lib]
name = "sysml_interchange"

[dependencies]
sysmlv2-model.workspace = true
sysmlv2-syntax.workspace = true
serde_json = "1"
uuid = { version = "1", features = ["v5"] }

[dev-dependencies]
sysmlv2-semantics.workspace = true

[lints]
workspace = true
