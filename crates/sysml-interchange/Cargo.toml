[package]
name = "sysml-interchange"
description = "Standard JSON interchange (SysML v2 API & Services serialization) for sysml-model"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
# its own, not the workspace one: `readme` inherited from
# `workspace.package` resolves against the workspace root, so every
# crate published carried the whole project's README
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
sysml-model.workspace = true
sysml-syntax.workspace = true
serde_json = "1"
uuid = { version = "1", features = ["v5"] }

[dev-dependencies]
sysml-semantics.workspace = true
