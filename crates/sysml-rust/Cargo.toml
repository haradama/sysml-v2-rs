[package]
name = "sysml-rust"
description = "The Rust side of a SysML model, both ways: an existing Rust API surface imported as a SysML package, and Rust generated from a resolved model"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
# its own, not the workspace one: `readme` inherited from
# `workspace.package` resolves against the workspace root, so every
# crate published carried the whole project's README
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
sysml-model.workspace = true
sysml-syntax.workspace = true
serde_json = "1"

[dev-dependencies]
sysml-semantics.workspace = true
