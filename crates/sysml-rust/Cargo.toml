[package]
name = "sysmlv2-rust"
description = "The Rust side of a SysML model, both ways -- an existing crate imported as a SysML package, and Rust generated from a resolved model -- and the seam, stated as data in no language in particular, through which any other language is imported or generated"
# its own, as the crates under it are: what a number moves for is a
# change in the crate it is on. 0.1.2 opens the seam: `surface` is what
# the import reads a crate as, and what an importer for any language
# writes; `plan` is what a generator for any language reads.
version = "0.1.2"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
# its own, not the workspace one: `readme` inherited from
# `workspace.package` resolves against the workspace root, so every
# crate published carried the whole project's README
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lib]
name = "sysml_rust"

[features]
# The JSON schemas of a surface and a plan, for whoever writes an
# importer or a generator: `sysml import-code --schema` and `sysml plan
# --schema` print them, and the MCP server hands the surface's to a
# client as the shape of a call. Behind a feature because they are
# derived by a crate that nothing reading or writing either needs.
schema = ["dep:schemars"]

[dependencies]
sysmlv2-model.workspace = true
sysmlv2-syntax.workspace = true
# the plan is read off a resolved workspace: what a feature bottoms out
# in is a question about the library it was resolved against
sysmlv2-semantics.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", optional = true }
# which characters a Rust identifier may hold: `is_alphabetic` is not it
unicode-ident = "1"

[dev-dependencies]
# the plan's tests plan against the standard library, which is where
# the answer to "what does this bottom out in" lives
sysmlv2-stdlib.workspace = true

[lints]
workspace = true
