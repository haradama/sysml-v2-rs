[package]
name = "sysmlv2-syntax"
description = "Lexer, parser and lossless syntax tree for the SysML v2 / KerML textual notation"
# its own: what a number moves for is a change in the crate it is on
version = "0.1.4"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
# its own, not the workspace one: `readme` inherited from
# `workspace.package` resolves against the workspace root, which would
# make every crate's README the whole project's
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lib]
name = "sysml_syntax"

[dependencies]
# how wide a line is, for deciding when one has to be broken: a string of
# Japanese is half as many characters as it is columns
unicode-width = "0.2"
logos.workspace = true
rowan.workspace = true

[dev-dependencies]
sysmlv2-corpus.workspace = true

[lints]
workspace = true
