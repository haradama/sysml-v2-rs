[package]
name = "sysmlv2-syntax"
description = "Lexer, parser and lossless syntax tree for the SysML v2 / KerML textual notation"
# its own: the crates here move when what is in them moves, and what
# moved is the formatter, which now opens a line too wide to read at
# its joints and takes the width to open it at
version = "0.1.2"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
# its own, not the workspace one: `readme` inherited from
# `workspace.package` resolves against the workspace root, so every
# crate published carried the whole project's README
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lib]
name = "sysml_syntax"

[dependencies]
# how wide a line is, for deciding when one has to be broken: a string of
# Japanese is half as many characters as it is columns
unicode-width = "0.2"
logos.workspace = true
rowan.workspace = true

[dev-dependencies]
sysmlv2-corpus.workspace = true
