[package]
name = "sysml-syntax"
description = "Lexer, parser and lossless syntax tree for the SysML v2 / KerML textual notation"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
# its own, not the workspace one: `readme` inherited from
# `workspace.package` resolves against the workspace root, so every
# crate published carried the whole project's README
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
logos.workspace = true
rowan.workspace = true

[dev-dependencies]
sysml-corpus.workspace = true
