[package]
name = "sysmlv2-diagram"
description = "Definition/specialization diagrams rendered to SVG from sysml-model"
# 0.2 rather than 0.1: `skin::read` answers with a `SkinError` where it
# answered with a `String`, and a caller that matched on the message does
# not compile against this. It was the one public function in the
# workspace whose error was a bare `String` -- which is nobody's error
# but its own, and cannot be put where an error goes. 0.2.1 draws a
# package's name inside its tab, and 0.2.2 steps one line over another
# where the two cross.
version = "0.2.2"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
# its own, not the workspace one: `readme` inherited from
# `workspace.package` resolves against the workspace root, so every
# crate published carried the whole project's README
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lib]
name = "sysml_diagram"

[dependencies]
sysmlv2-model.workspace = true
unicode-width = "0.2"

# The Eclipse Layout Kernel's own algorithms, ported to Rust. Where every
# box goes is this crate's one layout question, and ELK is the answer the
# standard's own tools give it; linking the port in means no binary to
# install and no process to spawn.
elkrs = "0.1"

# A skin is written down where a reader can keep it -- a file, an
# editor's settings -- and read here, so that the command line and the
# language server read the same one the same way. `elkrs` builds this
# already.
serde_json = "1"

[dev-dependencies]
sysmlv2-corpus.workspace = true
sysmlv2-semantics.workspace = true

[lints]
workspace = true
