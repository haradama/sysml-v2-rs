[package]
name = "sysmlv2-wasm"
description = "The SysML v2 language server as a WebAssembly module, for an editor with no machine under it"
# The inside of the VSCode extension, which ships the `.wasm` itself.
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"

[lib]
name = "sysml_wasm"
# `cdylib` is what the browser loads; `rlib` is the same code in a test
# that runs on the machine building it
crate-type = ["cdylib", "rlib"]

[dependencies]
sysmlv2-lsp.workspace = true
lsp-server = "0.7"
serde_json = "1"

# The one crate here that does not take `[lints] workspace = true`. A
# `cdylib` cannot name its exports without `#[no_mangle]`, which is an
# unsafe attribute, and the workspace `forbid`s unsafe -- a level no
# crate may argue with, which is the point of it. Same rule at `deny`
# instead, with the exception on the module that holds the exports and
# the reason written there.
[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
