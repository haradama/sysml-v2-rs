[package]
name = "sysmlv2-lsp"
description = "Language server for SysML v2 / KerML (diagnostics, go-to-definition, hover, symbols, formatting)"
# its own, now that it has one: the server reads a width to format at
# and a skin to draw in
version = "0.1.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
# its own, not the workspace one: `readme` inherited from
# `workspace.package` resolves against the workspace root, so every
# crate published carried the whole project's README
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "sysml-lsp"
path = "src/main.rs"

[lib]
name = "sysml_lsp"

[dependencies]
sysmlv2-syntax.workspace = true
sysmlv2-model.workspace = true
sysmlv2-semantics.workspace = true
# the standard library, so a server started with no path still resolves
sysmlv2-stdlib.workspace = true
sysmlv2-diagram.workspace = true
lsp-server = "0.7"
lsp-types = "0.94"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
sysmlv2-corpus.workspace = true
