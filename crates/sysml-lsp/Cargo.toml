[package]
name = "sysml-lsp"
description = "Language server for SysML v2 / KerML (diagnostics, go-to-definition, hover, symbols, formatting)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
# its own, not the workspace one: `readme` inherited from
# `workspace.package` resolves against the workspace root, so every
# crate published carried the whole project's README
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "sysml-lsp"
path = "src/main.rs"

[dependencies]
sysml-syntax.workspace = true
sysml-model.workspace = true
sysml-semantics.workspace = true
# the standard library, so a server started with no path still resolves
sysml-stdlib.workspace = true
# both of these offer the ELK layout, which is what the feature is
sysml-diagram = { workspace = true, features = ["elk"] }
lsp-server = "0.7"
lsp-types = "0.94"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
sysml-corpus.workspace = true
