[package]
name = "sysmlv2-model"
description = "In-memory element model (abstract syntax) for SysML v2 / KerML, generated from the official metamodel"
# its own: it reads a comment's body through `sysmlv2-syntax` 0.1.1
version = "0.1.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
# its own, not the workspace one: `readme` inherited from
# `workspace.package` resolves against the workspace root, so every
# crate published carried the whole project's README
readme = "README.md"
# `src/generated.rs` carries the specification's own OCL and wording,
# which is the OMG's rather than this crate's to license. NOTICE says
# which parts and under what terms, the way `sysml-stdlib` does for the
# standard library.
include = ["src/**", "tests/**", "README.md", "LICENSE-*", "NOTICE"]
keywords.workspace = true
categories.workspace = true

[lib]
name = "sysml_model"

[dependencies]
sysmlv2-syntax.workspace = true

# What writes `src/generated.rs` from `vendor/metamodel/`. It is not part
# of the library -- reading XMI at run time is no business of a model in
# memory -- so it and its XML parser are behind a feature, and anyone
# depending on this crate gets neither.
roxmltree = { version = "0.20", optional = true }

[features]
codegen = ["dep:roxmltree"]

[[bin]]
name = "sysml-codegen"
path = "src/bin/sysml-codegen.rs"
required-features = ["codegen"]
