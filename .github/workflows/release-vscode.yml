# The VSCode extension, one package per platform.
#
# The extension carries the language server inside it, and a binary is
# for one platform: so this builds `sysml-lsp` for each of the five the
# Marketplace knows and packages a `.vsix` around each. VSCode installs
# whichever matches the machine it is running on, which is what lets the
# extension promise that nothing needs configuring.
#
# Tag `vscode-v<version>` to release; run it by hand to build the
# packages without publishing them.

name: VSCode extension

on:
  push:
    tags: ["vscode-v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: publish to the Marketplace, rather than only build
        type: boolean
        default: false

jobs:
  package:
    name: ${{ matrix.vsce }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            vsce: linux-x64
          # cross-linked rather than built on an arm runner: the server
          # is pure Rust, so the cross linker is all it takes
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            vsce: linux-arm64
            apt: gcc-aarch64-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
            vsce: darwin-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            vsce: darwin-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            vsce: win32-x64
            exe: .exe
    steps:
      - uses: actions/checkout@v4
      # a released version is what the tag says it is
      - name: the tag says what the manifest says
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -eu
          manifest=$(node -p "require('./editors/vscode/package.json').version")
          tag="${GITHUB_REF_NAME#vscode-v}"
          [ "$manifest" = "$tag" ] || {
            echo "::error::tag says $tag, package.json says $manifest" >&2
            exit 1
          }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - if: matrix.apt != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}
      - name: build the language server
        run: cargo build --release -p sysml-lsp --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          # a fifth of the binary is symbols nobody downloading it reads;
          # the gates build without this, so a panic there still names
          # the frames it came through
          RUSTFLAGS: -C strip=symbols
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: editors/vscode
      # the server, the standard library, and the licences that have to
      # travel with them
      - name: bundle
        run: node scripts/bundle.mjs ../../target/${{ matrix.target }}/release/sysml-lsp${{ matrix.exe }}
        working-directory: editors/vscode
      # `vsce package` runs `vscode:prepublish`, which compiles
      - name: package
        run: npx --yes @vscode/vsce package --target ${{ matrix.vsce }} --out sysml-v2-${{ matrix.vsce }}.vsix
        working-directory: editors/vscode
      - uses: actions/upload-artifact@v4
        with:
          name: sysml-v2-${{ matrix.vsce }}
          path: editors/vscode/*.vsix
          if-no-files-found: error

  publish:
    name: publish
    needs: package
    if: startsWith(github.ref, 'refs/tags/vscode-v') || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # every platform's package under one version, in one call: the
      # Marketplace shows them as one extension either way
      - name: publish to the Marketplace
        run: npx --yes @vscode/vsce publish --packagePath packages/*.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      # and the same files where somebody who does not use the
      # Marketplace can install them by hand
      - name: attach them to the release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$GITHUB_REF_NAME" packages/*.vsix --generate-notes ||
          gh release upload "$GITHUB_REF_NAME" packages/*.vsix --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
