# The VSCode extension: one package, for everywhere.
#
# The extension carries the language server inside it, and the server is
# a WebAssembly module -- so there is nothing here to build per platform.
# The same `.vsix` installs on Linux, macOS and Windows, and runs in a
# browser at vscode.dev and github.dev, where there is no machine under
# the editor at all.
#
# Tag `vscode-v<version>` to release; run it by hand to build the
# package without publishing it.

name: VSCode extension

on:
  push:
    tags: ["vscode-v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: publish to the Marketplace, rather than only build
        type: boolean
        default: false

jobs:
  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # a released version is what the tag says it is
      - name: the tag says what the manifest says
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -eu
          manifest=$(node -p "require('./editors/vscode/package.json').version")
          tag="${GITHUB_REF_NAME#vscode-v}"
          [ "$manifest" = "$tag" ] || {
            echo "::error::tag says $tag, package.json says $manifest" >&2
            exit 1
          }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      # the `wasm` profile: link-time optimisation and no symbols, since
      # every byte of this is downloaded and compiled again by a browser
      - name: build the language server
        run: cargo build -p sysmlv2-wasm --target wasm32-unknown-unknown --profile wasm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: editors/vscode
      # the module, and the licences that have to travel with it
      - name: bundle
        run: node scripts/bundle.mjs ../../target/wasm32-unknown-unknown/wasm/sysml_wasm.wasm
        working-directory: editors/vscode
      # the server the package ships, answered through the worker's own
      # code: a package that cannot resolve a name is not one to publish
      - name: test
        run: npm test
        working-directory: editors/vscode
      # `vsce package` runs `vscode:prepublish`, which compiles
      - name: package
        run: npx --yes @vscode/vsce package --out sysml-v2.vsix
        working-directory: editors/vscode
      - uses: actions/upload-artifact@v4
        with:
          name: sysml-v2
          path: editors/vscode/*.vsix
          if-no-files-found: error

  publish:
    name: publish
    needs: package
    if: startsWith(github.ref, 'refs/tags/vscode-v') || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: publish to the Marketplace
        run: npx --yes @vscode/vsce publish --packagePath packages/*.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      # and the same file where somebody who does not use the
      # Marketplace can install it by hand
      - name: attach it to the release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$GITHUB_REF_NAME" packages/*.vsix --generate-notes ||
          gh release upload "$GITHUB_REF_NAME" packages/*.vsix --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
