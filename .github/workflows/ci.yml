name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v20

  test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the official SysML-v2-Release corpus drives the parser,
          # resolution, formatter and interchange regression tests
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      # --all-features reaches the metamodel generator, which is behind
      # one: it writes `sysml-model/src/generated.rs`, and its test is
      # what holds the committed file to what it would write
      - name: tests (incl. corpus regressions)
        run: cargo test --release --all-features

  # Nothing else here would notice the toolchain getting an order of
  # magnitude slower. The gates are correctness gates: a resolver that
  # takes a quarter of a minute where it took a second still resolves
  # every reference, and every test still passes -- slowly. That has
  # happened twice already, both times because an answer that wants an
  # index was being scanned for instead, and both times it was found by
  # somebody waiting rather than by CI. Both are written down where they
  # were fixed: `ResolveStats::lookups` ("a millisecond and half a
  # minute on a forty-line file") and `Workspace::reverse_ends` ("the
  # check taking seconds and taking a quarter of a minute").
  #
  # The bound is deliberately loose. A shared runner has no constant, so
  # a threshold tight enough to catch a 20% regression would be a
  # threshold that fails on a noisy afternoon; this one catches the
  # shape-of-the-algorithm regressions that are what actually happen.
  # Locally the whole corpus checks in about four seconds.
  timing:
    name: the corpus still checks in seconds, not minutes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build the tool
        run: cargo build --release -p sysmlv2-cli
      # one tree at a time, which is how each of them is a model: the
      # KerML examples declare a class `Camera` and the SysML training
      # models a package of that name, so a workspace holding both has
      # an `import Camera` in it that answers to two different things
      - name: parse, resolve and check all 403 files
        run: |
          set -eu
          started=$(date +%s)
          for tree in \
            vendor/sysml-v2-release/sysml/src \
            vendor/sysml-v2-release/kerml/src \
            crates/sysml-stdlib/library; do
            ./target/release/sysml --format json check "$tree" > /dev/null
          done
          took=$(( $(date +%s) - started ))
          echo "checked the whole corpus in ${took}s"
          if [ "$took" -gt 120 ]; then
            echo "::error::the corpus took ${took}s; it takes about four" >&2
            exit 1
          fi

  # `rust-version` in Cargo.toml is a promise to users of the crates, and
  # nothing else here would notice it being broken: the other jobs build
  # with whatever `stable` is that day
  msrv:
    name: builds on the declared minimum Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86
      - uses: Swatinem/rust-cache@v2
      # no lockfile is checked in, so this resolves afresh -- which is
      # what somebody depending on the published crates would get, and
      # the reason the number was wrong: a dependency had raised its own
      # minimum and nothing here noticed
      - name: check on the declared minimum
        run: cargo check --workspace --all-features --all-targets

  # what a drawing is worth is not something `cargo test` can see: that
  # it parses as XML, and that the rasteriser a reviewer looks at it
  # through still reads what the SVG writer writes
  drawings:
    name: the drawings a reviewer looks at
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: render corpus models and check the SVG is well-formed
        run: |
          set -eu
          cargo build --release -p sysmlv2-cli
          for model in \
            "vendor/sysml-v2-release/sysml/src/examples/Vehicle Example/VehicleDefinitions.sysml" \
            "vendor/sysml-v2-release/sysml/src/examples/Simple Tests/PartTest.sysml" \
            "vendor/sysml-v2-release/sysml/src/training/24. States/State Actions.sysml"; do
            target/release/sysml diagram "$model" -o out.svg
            python3 -c 'import sys, xml.etree.ElementTree as et; et.parse("out.svg"); print("ok", sys.argv[1])' "$model"
          done
      # `tools/render` is outside the workspace, so `cargo test` never
      # builds it, and the way it substitutes the CSS variables the
      # diagrams carry is coupled to what the SVG writer emits
      - name: the review rasteriser still reads what the SVG writer writes
        run: |
          set -eu
          target/release/sysml diagram \
            "vendor/sysml-v2-release/sysml/src/examples/Vehicle Example/VehicleDefinitions.sysml" \
            -o vehicle.svg
          cargo run --manifest-path tools/render/Cargo.toml -- vehicle.svg vehicle.png 2
          python3 - <<'PY'
          import struct
          data = open("vehicle.png", "rb").read()
          assert data[:8] == b"\x89PNG\r\n\x1a\n", "not a PNG"
          width, height = struct.unpack(">II", data[16:24])
          assert width > 1000 and height > 500, (width, height)
          # a drawing whose paint went unresolved, or whose labels were
          # dropped for want of a font, is a nearly blank page, and a
          # blank page of this size compresses to a few kilobytes
          assert len(data) > 50000, f"{len(data)} bytes looks blank"
          print(f"rasterised {width}x{height}, {len(data)} bytes")
          PY

  # the worked example is excluded from the workspace, so `cargo test`
  # never builds it: nothing else would notice a change to `rustgen`
  # that rewrote what it generates, or broke what the README shows
  example:
    name: the Arduino example regenerates and runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: the checked-in Rust is what rustgen writes
        working-directory: examples/arduino-uno
        run: |
          set -eu
          cargo run --manifest-path ../../Cargo.toml -p sysmlv2-cli -- rustgen \
            model/blink.sysml model/requirements.sysml model/verification.sysml \
            --library model/hardware.sysml \
            --library model/middleware.sysml \
            --library ../../crates/sysml-stdlib/library \
            -o /tmp/generated.rs
          diff -u src/generated.rs /tmp/generated.rs
      - name: the model resolves whole
        run: |
          cargo run -p sysmlv2-cli -- check examples/arduino-uno/model \
            crates/sysml-stdlib/library
      - name: it runs, and says what the README says it says
        working-directory: examples/arduino-uno
        run: |
          set -eu
          cargo run --quiet > out.txt
          cat out.txt
          grep -qx '6 writes, 3 of them high' out.txt
      - name: its own tests pass
        working-directory: examples/arduino-uno
        run: cargo test

  # the extension is the language server's only client, so an API change
  # that breaks it would otherwise go unnoticed: nothing else compiles
  # this TypeScript
  vscode:
    name: VSCode extension compiles and its preview page works
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # jsdom, which the preview page is driven under, runs on 22 and up
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # `npm ci` wants a lockfile, and this one is not checked in
      - name: install
        run: npm install --no-audit --no-fund
        working-directory: editors/vscode
      - name: compile
        run: npm run compile
        working-directory: editors/vscode
      # the preview page is plain JavaScript that TypeScript never sees,
      # so it is driven under a DOM instead
      - name: test
        run: npm test
        working-directory: editors/vscode

  coverage:
    name: C0 coverage (every line executed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - name: measure
        run: cargo llvm-cov --workspace --all-features --summary-only --fail-under-lines 99
      - name: no uncovered lines (C0 = 100%)
        run: |
          missing=$(cargo llvm-cov report --show-missing-lines | sed -n '/Uncovered Lines/,$p' | grep -c '\.rs: [0-9]' || true)
          echo "files with uncovered lines: $missing"
          test "$missing" -eq 0
