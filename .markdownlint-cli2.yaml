config:
  extends: ./.markdownlint.yaml
globs:
  - "**/*.md"
ignores:
  - vendor/sysml-v2-release/**
  - target/**
  # installed by `npm install` for the extension; CI lints a fresh
  # checkout and never sees these, so a local run should not either
  - editors/vscode/node_modules/**
  - web/node_modules/**
